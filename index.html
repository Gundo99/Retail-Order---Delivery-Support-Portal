<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Order & Delivery Support Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Retail Order & Delivery Support Portal</h1>

        <form id="bookingForm">
            <label for="customerName">Customer Name:</label>
            <input type="text" id="customerName" required>

            <label for="productName">Product Name:</label>
            <input type="text" id="productName" required>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" min="1" required>

            <label for="unitPrice">Unit Price:</label>
            <input type="number" id="unitPrice" min="1" required>

            <label for="memberStatus">Member Status:</label>
            <select id="memberStatus" required>
                <option value="">Select a Member Status</option>
                <option value="Employee">Employee</option>
                <option value="Customer">Customer</option>
            </select>

            <label for="deliveryType">Delivery Type:</label>
            <select id="deliveryType" required>
                <option value="">Select a Delivery Type</option>
                <option value="Pick-up">Pick-up</option>
                <option value="Deliver">Deliver at the door</option>
            </select>        

            <button type="submit">Submit Booking</button>
        </form>

        <div id="output">
            <h2>Booking Result</h2>
            <p>No booking submitted yet.</p>
        </div>     

        <div id="orderList"></div>

                <!--to filter by status--> 
        <label for="statusFilter">Filter by Status:</label>
        <select id="statusFilter">
            <option value="All">All Statuses</option>
            <option value="Pending">Pending</option>
            <option value="Confirmed">Confirmed</option>
        </select>

    </div>

    <script src="script.js"></script>
</body>
</html>
